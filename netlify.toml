# Netlify configuration — Verdant tea storefront
#
# The site is a static, dependency-free bundle living in verdant-tea/, so there
# is nothing to build: Netlify just publishes that directory. The repository
# root stays reserved for the GitHub profile README.

[build]
  publish = "verdant-tea"
  command = ""

[build.processing]
  skip_processing = false

# Long-cache the fingerprint-free shared assets but let HTML revalidate, so a
# redeploy is picked up immediately instead of serving a stale page.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    X-Content-Type-Options = "nosniff"

# The storefront has no server, so any unknown path is a genuine 404 rather
# than a client-side route. Netlify serves verdant-tea/404.html automatically.
